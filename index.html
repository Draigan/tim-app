<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" sizes="48x48" />
    <link rel="icon" href="/icons/icon-192x192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icons/icon-512x512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Timberfell" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#252525" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f6b3a" />
    <title>Timberfell</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var _theme = localStorage.getItem('theme');
      if (!_theme || _theme === 'dark') document.documentElement.classList.add('dark');
      var _hash = new URLSearchParams(window.location.hash.slice(1));
      if (_hash.get('type') === 'invite') sessionStorage.setItem('pendingInvite', '1');
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
